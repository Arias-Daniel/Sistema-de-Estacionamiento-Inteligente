<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estacionamiento Inteligente | Estado en Vivo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* === TEMA FUTURISTA / SMART CITY === */
        :root {
            --bg-dark: #0f172a;
            --bg-panel: rgba(30, 41, 59, 0.7);
            --neon-cyan: #00f2fe;
            --neon-green: #10b981;
            --neon-red: #ef4444;
        }

        body {
            background-color: var(--bg-dark);
            color: #e2e8f0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 242, 254, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.05), transparent 25%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* NAVBAR EFECTO CRISTAL */
        .glass-nav {
            background: rgba(15, 23, 42, 0.8) !important;
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .brand-text {
            background: linear-gradient(90deg, #fff, var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .btn-neon {
            background: transparent;
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            border-radius: 30px;
            padding: 0.4rem 1.2rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.1);
        }

        .btn-neon:hover {
            background: var(--neon-cyan);
            color: var(--bg-dark);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.5);
        }

        /* PESTAÑAS FUTURISTAS */
        .public-header {
            padding: 80px 0 30px 0; /* Espacio para el navbar fijo */
        }

        .nav-tabs {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-tabs .nav-link {
            color: #94a3b8;
            border: none;
            background: transparent;
            font-size: 1.1rem;
            padding: 1rem 2rem;
            transition: 0.3s;
        }

        .nav-tabs .nav-link:hover {
            color: var(--neon-cyan);
        }

        .nav-tabs .nav-link.active {
            color: var(--neon-cyan);
            background: rgba(0, 242, 254, 0.05);
            border-bottom: 2px solid var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }

        /* PANEL PRINCIPAL (GLASSMORPHISM) */
        .glass-card {
            background: var(--bg-panel);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        /* ESPACIOS DE PARQUEO */
        .futuristic-spot {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s ease;
        }

        .futuristic-spot.available {
            border-color: rgba(16, 185, 129, 0.3);
            box-shadow: inset 0 0 20px rgba(16, 185, 129, 0.05);
        }

        .futuristic-spot.occupied {
            border-color: rgba(239, 68, 68, 0.3);
