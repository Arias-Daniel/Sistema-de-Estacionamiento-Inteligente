<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estacionamiento Inteligente | Estado en Vivo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-panel: rgba(30, 41, 59, 0.7);
            --neon-cyan: #00f2fe;
            --neon-green: #10b981;
            --neon-red: #ef4444;
        }

        body {
            background-color: var(--bg-dark);
            color: #e2e8f0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-image: radial-gradient(circle at 15% 50%, rgba(0, 242, 254, 0.05), transparent 25%);
            min-height: 100vh;
            margin: 0;
        }

        .futuristic-spot {
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.3s ease; /* Solo transición de color simple */
        }

        .glass-nav {
            background: rgba(15, 23, 42, 0.8) !important;
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .brand-text {
            background: linear-gradient(90deg, #fff, var(--neon-cyan));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .btn-neon {
            background: transparent;
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            border-radius: 30px;
            padding: 0.4rem 1.2rem;
            text-decoration: none;
            font-weight: 600;
        }

        .btn-neon:hover {
            background: var(--neon-cyan);
            color: var(--bg-dark);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }

        .public-header { padding: 100px 0 20px 0; }

        .nav-tabs .nav-link { color: #94a3b8; border: none; padding: 1rem 2rem; }
        .nav-tabs .nav-link.active {
            color: var(--neon-cyan);
            background: rgba(0, 242, 254, 0.05);
            border-bottom: 2px solid var(--neon-cyan);
        }

        .glass-card {
            background: var(--bg-panel);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
        }

        .glow-text-green { color: var(--neon-green); text-shadow: 0 0 8px rgba(16, 185, 129, 0.4); }
        .glow-text-red { color: var(--neon-red); text-shadow: 0 0 8px rgba(239, 68, 68, 0.4); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg glass-nav fixed-top">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <i class="fas fa-satellite-dish me-2 fs-4" style="color: var(--neon-cyan);"></i>
                <span class="brand-text">SMART PARKING V2</span>
            </a>
            <a href="login.html" class="btn btn-neon"><i class="fas fa-fingerprint me-2"></i>Personal</a>
        </div>
    </nav>

    <div class="public-header text-center">
        <div class="container">
            <h1 class="fw-bold text-white mb-3">Estado en Tiempo Real</h1>
            
            <div id="smartStatusContainer" class="mb-4">
                <span class="badge rounded-pill p-3 fs-6" id="smartBadge" style="border: 1px solid var(--neon-cyan); color: var(--neon-cyan);">
                    <i class="fas fa-sync-alt fa-spin me-2"></i>Sincronizando...
                </span>
            </div>

            <div class="row justify-content-center mb-4">
                <div class="col-auto">
                    <div class="p-3 rounded-4 shadow d-flex align-items-center" style="background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(0, 242, 254, 0.2);">
                        <div class="px-3 border-end border-secondary text-center">
                            <small class="text-secondary d-block text-uppercase fw-bold" style="font-size: 0.6rem;">Base</small>
                            <span class="text-white fs-5 fw-bold" id="baseFeeDisplay">$ --</span>
                        </div>
                        <div class="px-3 border-end border-secondary text-center">
                            <small class="text-secondary d-block text-uppercase fw-bold" style="font-size: 0.6rem;">Extra</small>
                            <span class="text-white fs-5 fw-bold" id="extraFeeDisplay">$ --</span>
                        </div>
                        <div class="px-3 text-center">
                            <small class="text-secondary d-block text-uppercase fw-bold" style="font-size: 0.6rem;">Max Día</small>
                            <span class="glow-text-green fs-5 fw-bold" id="maxFeeDisplay">$ --</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <ul class="nav nav-tabs justify-content-center border-0" id="floorTabs">
                <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#piso1">Nivel 1</button></li>
                <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#piso2">Nivel 2</button></li>
            </ul>
        </div>
    </div>

    <div class="container mb-4">
        <div class="glass-card p-4">
            <div class="tab-content">
                <div class="tab-pane fade show active" id="piso1">
                    <div class="row g-4" id="parkingMapContainer"></div>
                </div>
                <div class="tab-pane fade text-center py-5" id="piso2">
                    <h3 class="text-secondary">Nivel 2 Próximamente</h3>
                </div>
            </div>
        </div>

        <div class="text-center mt-5 mb-5">
            <button class="btn btn-neon px-5 py-3 shadow-lg" data-bs-toggle="modal" data-bs-target="#ticketModal">
                <i class="fas fa-qrcode me-2"></i> GENERAR TICKET DIGITAL
            </button>
        </div>
    </div>

    <div class="modal fade" id="ticketModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card" style="background: #0f172a; border: 1px solid var(--neon-cyan);">
                <div class="modal-header border-0"><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
                <div class="modal-body text-center p-4">
                    <div id="inputSection">
                        <h5 class="text-white mb-3">Ingrese su Placa</h5>
                        <input type="text" id="plateInput" class="form-control form-control-lg bg-dark text-white border-secondary text-center mb-3" placeholder="ABC-123" style="text-transform: uppercase;">
                        <button class="btn btn-neon w-100" onclick="generateQR()">GENERAR</button>
                    </div>
                    <div id="qrSection" class="d-none">
                        <div id="qrcode" class="bg-white p-3 d-inline-block rounded-3 mb-3"></div>
                        <h4 class="text-white fw-bold mb-1" id="displayPlate">---</h4>
                        <p class="text-secondary small" id="displayTime"></p>
                        <button class="btn btn-outline-secondary btn-sm mt-2" onclick="resetTicket()">Nuevo</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const container = document.getElementById('parkingMapContainer');
        for(let i=1; i<=8; i++) {
            container.innerHTML += `
                <div class="col-md-3 col-sm-6">
                    <div class="futuristic-spot" data-spot="${i}">
                        <div class="text-center w-100">
                            <i class="fas fa-car fa-2x mb-2 spot-icon"></i>
                            <div class="fw-bold fs-5 text-white">P1 - ${i}</div>
                            <span class="badge">--</span>
                        </div>
                    </div>
                </div>`;
        }

        async function updateFees() {
            try {
                const res = await fetch('/api/settings');
                const s = await res.json();
                document.getElementById('baseFeeDisplay').textContent = `$ ${s.baseFee.toLocaleString()}`;
                document.getElementById('extraFeeDisplay').textContent = `$ ${s.additionalHourFee.toLocaleString()}`;
                document.getElementById('maxFeeDisplay').textContent = `$ ${s.maxDailyFee.toLocaleString()}`;
            } catch (e) {}
        }

        async function updateStatus() {
            try {
                const res = await fetch('/api/parking-status');
                const d = await res.json();
                let occupied = 0;

                d.data.forEach(spot => {
                    const el = document.querySelector(`.futuristic-spot[data-spot="${spot.id}"]`);
                    if (el) {
                        const badge = el.querySelector('.badge');
                        const icon = el.querySelector('.spot-icon');
                        
                        if (spot.is_occupied) {
                            occupied++;
                            el.style.borderColor = 'var(--neon-red)';
                            badge.textContent = 'OCUPADO';
                            badge.className = 'badge bg-danger';
                            icon.className = 'fas fa-car-side fa-2x mb-2 glow-text-red';
                        } else {
                            el.style.borderColor = 'var(--neon-green)';
                            badge.textContent = 'LIBRE';
                            badge.className = 'badge bg-success';
                            icon.className = 'fas fa-car fa-2x mb-2 glow-text-green';
                        }
                    }
                });

                const avail = d.data.length - occupied;
                const sb = document.getElementById('smartBadge');
                if (avail === 0) {
                    sb.innerHTML = `<i class="fas fa-exclamation-triangle me-2"></i> NIVEL 1 LLENO`;
                    sb.style.color = 'var(--neon-red)';
                } else {
                    sb.innerHTML = `<i class="fas fa-check-circle me-2"></i> DISPONIBLES: ${avail}`;
                    sb.style.color = 'var(--neon-cyan)';
                }
            } catch (e) { console.error(e); }
        }

        function generateQR() {
            const p = document.getElementById('plateInput').value.trim().toUpperCase();
            if(!p) return alert("Ingrese placa");
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), { 
                text: JSON.stringify({ placa: p, fecha: new Date().toISOString() }), 
                width: 180, height: 180 
            });
            document.getElementById('displayPlate').textContent = p;
            document.getElementById('displayTime').textContent = "Entrada: " + new Date().toLocaleTimeString();
            document.getElementById('inputSection').classList.add('d-none');
            document.getElementById('qrSection').classList.remove('d-none');
        }

        function resetTicket() {
            document.getElementById('plateInput').value = "";
            document.getElementById('inputSection').classList.remove('d-none');
            document.getElementById('qrSection').classList.add('d-none');
        }

        // Ejecución
        updateFees(); 
        updateStatus();
        setInterval(updateStatus, 3000); // 3 segundos es seguro para sincronización
        setInterval(updateFees, 30000);
    </script>
</body>
</html>
