<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estacionamiento Inteligente | Estado en Vivo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-panel: rgba(30, 41, 59, 0.7);
            --neon-cyan: #00f2fe;
            --neon-green: #10b981;
            --neon-red: #ef4444;
        }

        body {
            background-color: var(--bg-dark);
            color: #e2e8f0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-image: radial-gradient(circle at 15% 50%, rgba(0, 242, 254, 0.05), transparent 25%);
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        /* --- FONDO 3D ANIMADO (NUEVO) --- */
        .bg-cube-wrapper {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 400px;
            height: 400px;
            margin-top: -200px;
            margin-left: -200px;
            perspective: 1000px;
            z-index: -1; /* Al fondo de todo */
            pointer-events: none; /* No estorba al hacer clic */
            /* ESTO ES LO NUEVO: Hace que se mueva por toda la pantalla */
            animation: floatAround 35s infinite ease-in-out alternate; 
        }

        /* TRAYECTORIA DEL CUBO DE ESQUINA A ESQUINA */
        @keyframes floatAround {
            0% { transform: translate(-35vw, -35vh); }
            25% { transform: translate(35vw, -15vh); }
            50% { transform: translate(-25vw, 35vh); }
            75% { transform: translate(35vw, 35vh); }
            100% { transform: translate(-35vw, -35vh); }
        }

        .bg-cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: rotateCube 25s infinite linear;
        }

        .bg-cube .face {
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(0, 242, 254, 0.02); /* Relleno holográfico super suave */
            border: 1px solid rgba(0, 242, 254, 0.15); /* Borde neón sutil */
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.05) inset;
        }

        .bg-cube .front  { transform: rotateY(  0deg) translateZ(200px); }
        .bg-cube .back   { transform: rotateY(180deg) translateZ(200px); }
        .bg-cube .right  { transform: rotateY( 90deg) translateZ(200px); }
        .bg-cube .left   { transform: rotateY(-90deg) translateZ(200px); }
        .bg-cube .top    { transform: rotateX( 90deg) translateZ(200px); }
        .bg-cube .bottom { transform: rotateX(-90deg) translateZ(200px); }

        @keyframes rotateCube {
            0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
            100% { transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg); }
        }
        /* --------------------------------- */

        /* --- ANIMACIONES --- */
        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .futuristic-spot {
            background: var(--bg-panel);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            height: 135px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            animation: fadeInScale 0.6s ease-out backwards;
        }

        .spot-occupied-anim { animation: pulse-red 2s infinite; border-color: var(--neon-red) !important; }
        .spot-free-anim { animation: pulse-green 2s infinite; border-color: var(--neon-green) !important; }

        /* --- NAVEGACIÓN Y BOTONES --- */
        .glass-nav {
            background: rgba(15, 23, 42, 0.9) !important;
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 242, 254, 0.2);
        }

        .brand-text {
            background: linear-gradient(90deg, #fff, var(--neon-cyan));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .btn-neon {
            background: transparent;
            color: var(--neon-cyan);
            border: 2px solid var(--neon-cyan);
            border-radius: 50px;
            padding: 0.6rem 2rem;
            font-weight: bold;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-neon:hover {
            background: var(--neon-cyan);
            color: var(--bg-dark);
            box-shadow: 0 0 25px var(--neon-cyan);
            transform: translateY(-2px);
        }

        .public-header { padding: 110px 0 20px 0; }

        .nav-tabs .nav-link { color: #94a3b8; border: none; padding: 1rem 2rem; transition: 0.3s; }
        .nav-tabs .nav-link.active {
            color: var(--neon-cyan);
            background: rgba(0, 242, 254, 0.05);
            border-bottom: 2px solid var(--neon-cyan);
        }

        .glass-card {
            background: var(--bg-panel);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <div class="bg-cube-wrapper">
        <div class="bg-cube">
            <div class="face front"></div>
            <div class="face back"></div>
            <div class="face right"></div>
            <div class="face left"></div>
            <div class="face top"></div>
            <div class="face bottom"></div>
        </div>
    </div>
    <nav class="navbar navbar-expand-lg glass-nav fixed-top">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <i class="fas fa-satellite-dish me-2 fs-4" style="color: var(--neon-cyan);"></i>
                <span class="brand-text">SMART PARKING V2</span>
            </a>
            <a href="login.html" class="btn btn-neon btn-sm">
                <i class="fas fa-fingerprint me-2"></i>Personal
            </a>
        </div>
    </nav>

    <div class="public-header text-center">
        <div class="container">
            <h1 class="fw-bold text-white mb-3">ESTADO EN TIEMPO REAL</h1>
            
            <div id="smartStatusContainer" class="mb-4">
                <span class="badge rounded-pill p-3 fs-6 shadow-sm" id="smartBadge" style="border: 2px solid var(--neon-cyan); color: var(--neon-cyan);">
                    <i class="fas fa-sync-alt fa-spin me-2"></i>Sincronizando...
                </span>
            </div>

            <div class="row justify-content-center mb-4">
                <div class="col-auto">
                    <div class="p-3 rounded-4 shadow-lg d-flex align-items-center" style="background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(0, 242, 254, 0.2); backdrop-filter: blur(10px);">
                        <div class="px-4 border-end border-secondary text-center">
                            <small class="text-secondary d-block text-uppercase fw-bold" style="font-size: 0.6rem;">Base</small>
                            <span class="text-white fs-5 fw-bold" id="baseFeeDisplay">$ --</span>
                        </div>
                        <div class="px-4 border-end border-secondary text-center">
                            <small class="text-secondary d-block text-uppercase fw-bold" style="font-size: 0.6rem;">Extra</small>
                            <span class="text-white fs-5 fw-bold" id="extraFeeDisplay">$ --</span>
                        </div>
                        <div class="px-4 text-center">
                            <small class="text-secondary d-block text-uppercase fw-bold" style="font-size: 0.6rem;">Max Día</small>
                            <span class="glow-text-green fs-5 fw-bold" id="maxFeeDisplay">$ --</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <ul class="nav nav-tabs justify-content-center border-0" id="floorTabs">
                <li class="nav-item">
                    <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#piso1">Nivel 1</button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" data-bs-toggle="tab" data-bs-target="#piso2">Nivel 2</button>
                </li>
            </ul>
        </div>
    </div>

    <div class="container mb-4">
        <div class="glass-card p-4">
            <div class="tab-content">
                <div class="tab-pane fade show active" id="piso1">
                    <div class="row g-4" id="parkingMapContainer">
                        <script>
                            for(let i=1; i<=8; i++) {
                                document.write(`
                                    <div class="col-md-3 col-6">
                                        <div class="futuristic-spot" data-spot="${i}" style="animation-delay: ${i*0.1}s">
                                            <div class="text-center w-100">
                                                <i class="fas fa-car fa-2x mb-2 spot-icon"></i>
                                                <div class="fw-bold fs-5 text-white">P1 - ${i}</div>
                                                <span class="badge badge-status">--</span>
                                            </div>
                                        </div>
                                    </div>
                                `);
                            }
                        </script>
                    </div>
                </div>
                <div class="tab-pane fade text-center py-5" id="piso2">
                    <div class="spinner-border text-info mb-3" role="status"></div>
                    <h3 class="text-info">Nivel 2 en Calibración</h3>
                    <p class="text-muted">Próximamente disponible para usuarios.</p>
                </div>
            </div>
        </div>

        <div class="text-center mt-5 mb-5">
            <button class="btn btn-neon shadow-lg" data-bs-toggle="modal" data-bs-target="#ticketModal">
                <i class="fas fa-qrcode me-2"></i> Generar Ticket Digital
            </button>
        </div>
    </div>

    <div class="modal fade" id="ticketModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card p-4" style="background: #020617; border: 2px solid var(--neon-cyan); border-radius: 25px;">
                <div class="modal-body text-center">
                    <div id="inputSection">
                        <h4 class="text-white mb-4">Verificación de Vehículo</h4>
                        <input type="text" id="plateInput" class="form-control form-control-lg bg-dark text-white text-center border-info mb-4" placeholder="ABC-123" style="text-transform: uppercase;">
                        <button class="btn btn-neon w-100" onclick="generateQR()">VERIFICAR Y CREAR</button>
                    </div>
                    <div id="qrSection" class="d-none">
                        <div id="qrcode" class="bg-white p-3 d-inline-block rounded-4 mb-3 shadow-lg"></div>
                        <h2 id="displayPlate" class="text-info fw-bold mb-1"></h2>
                        <p id="displayTime" class="text-secondary small"></p>
                        <button class="btn btn-outline-secondary btn-sm mt-3" onclick="resetUI()">Nuevo</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function updateFees() {
            try {
                const res = await fetch('/api/settings');
                const s = await res.json();
                document.getElementById('baseFeeDisplay').textContent = `$ ${s.baseFee.toLocaleString()}`;
                document.getElementById('extraFeeDisplay').textContent = `$ ${s.additionalHourFee.toLocaleString()}`;
                document.getElementById('maxFeeDisplay').textContent = `$ ${s.maxDailyFee.toLocaleString()}`;
            } catch (e) {}
        }

        async function updateStatus() {
            try {
                const res = await fetch('/api/parking-status');
                const d = await res.json();
                if (!d.data) return;

                let occupied = 0;
                d.data.forEach(spot => {
                    const el = document.querySelector(`.futuristic-spot[data-spot="${spot.id}"]`);
                    if (el) {
                        const badge = el.querySelector('.badge-status');
                        const icon = el.querySelector('.spot-icon');
                        
                        if (spot.is_occupied) {
                            occupied++;
                            el.className = 'futuristic-spot spot-occupied-anim';
                            badge.textContent = 'OCUPADO';
                            badge.className = 'badge badge-status bg-danger';
                            icon.className = 'fas fa-car-side fa-2x mb-2 glow-text-red';
                        } else {
                            el.className = 'futuristic-spot spot-free-anim';
                            badge.textContent = 'LIBRE';
                            badge.className = 'badge badge-status bg-success';
                            icon.className = 'fas fa-car fa-2x mb-2 glow-text-green';
                        }
                    }
                });

                const avail = d.data.length - occupied;
                const sb = document.getElementById('smartBadge');
                sb.innerHTML = avail === 0 ? `<i class="fas fa-ban me-2"></i> LLENO` : `<i class="fas fa-check-circle me-2"></i> DISPONIBLES: ${avail}`;
                sb.style.color = avail === 0 ? 'var(--neon-red)' : 'var(--neon-cyan)';
                sb.style.borderColor = avail === 0 ? 'var(--neon-red)' : 'var(--neon-cyan)';
            } catch (e) {}
        }

        async function generateQR() {
            const plateInputRaw = document.getElementById('plateInput').value.trim();
            const p = plateInputRaw.toUpperCase();
            if(!p) return alert("Ingrese placa");

            const btn = document.querySelector('#inputSection button');
            btn.innerText = "VERIFICANDO..."; btn.disabled = true;

            try {
                const res = await fetch('/api/parking-status');
                const dataObj = await res.json();
                
                console.log("Respuesta de la API:", dataObj.data); 

                const apiSendsPlates = dataObj.data.some(s => s.hasOwnProperty('license_plate'));

                let isValid = false;
                let activeSpotId = "N/A";

                if (!apiSendsPlates) {
                    // MODO BYPASS
                    const occupiedSpots = dataObj.data.filter(s => s.is_occupied);
                    if (occupiedSpots.length > 0) {
                        isValid = true;
                        activeSpotId = occupiedSpots[0].id;
                        alert("⚠️ MODO BYPASS ACTIVO:\nLa placa se generó, pero tu servidor NO está enviando la variable 'license_plate' al HTML para validar estrictamente. Verifica tu archivo server.js");
                    }
                } else {
                    // MODO ESTRICTO
                    const activeSpot = dataObj.data.find(s => s.is_occupied && s.license_plate && s.license_plate.trim().toUpperCase() === p);
                    if (activeSpot) {
                        isValid = true;
                        activeSpotId = activeSpot.id;
                    }
                }

                if (isValid) {
                    document.getElementById('qrcode').innerHTML = "";
                    new QRCode(document.getElementById("qrcode"), { 
                        text: JSON.stringify({ placa: p, entrada: new Date().toISOString() }), 
                        width: 200, height: 200 
                    });
                    document.getElementById('displayPlate').innerText = p;
                    document.getElementById('displayTime').innerText = "Vínculo con Sensor P1-" + activeSpotId + " Establecido";
                    document.getElementById('inputSection').classList.add('d-none');
                    document.getElementById('qrSection').classList.remove('d-none');
                } else {
                    alert(`ERROR: No se puede validar la placa.\nVerifique que haya ingresado correctamente al estacionamiento y coincida con el registro.`);
                }
            } catch (e) { alert("Error de conexión"); console.error(e); }
            finally { btn.innerText = "VERIFICAR Y CREAR"; btn.disabled = false; }
        }

        function resetUI() {
            document.getElementById('plateInput').value = "";
            document.getElementById('inputSection').classList.remove('d-none');
            document.getElementById('qrSection').classList.add('d-none');
        }

        updateFees(); updateStatus();
        setInterval(updateStatus, 2500); 
        setInterval(updateFees, 30000);
    </script>
</body>
</html>
